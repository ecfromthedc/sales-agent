name = "rt-sales-call-agent"
main = "src/index.ts"
compatibility_date = "2026-05-14"
compatibility_flags = ["nodejs_compat"]
account_id = "d5fbf64067844a591842c14f1b53bd79"

# Cron triggers:
#   */5 * * * *  — poll Drive for new Meet transcripts (every 5 minutes)
#   7 13 * * *   — daily inbox-triage email digest (~13:07 UTC, morning-ish ET).
#                  INERT until SLACK_EMAIL_DIGEST_CHANNEL_ID is set; read/notify
#                  only (no email send/draft). See src/roles/email/digest.ts.
[triggers]
crons = ["*/5 * * * *", "7 13 * * *"]

# Runtime config (not secrets)
[vars]
NOTION_DEALS_DB_ID = "3611465b-b829-81de-a237-cf6516fe8fcf"
NOTION_TRANSCRIPTS_DB_ID = "3611465b-b829-81a0-b6a0-cc55e6ed784c"
NOTION_PITCH_ARTIFACTS_DB_ID = "3611465b-b829-8174-875c-c9a6db1540cd"
MEET_RECORDINGS_FOLDER_ID = "19krQR2fbafw3h0uxLF7SvEoh2mgW0Sy8"        # primary Meet Recordings folder
SLACK_BRIEF_CHANNEL_ID = "C0B47J6FZ47"
# SLACK_BRIEF_CHANNEL_ID_SEENO = "C..."      # optional; split Seeno's briefs to their own channel. Unset ⇒ Seeno shares SLACK_BRIEF_CHANNEL_ID above.
SLACK_PROPOSALS_CHANNEL_ID = "C0B670L4VRS"   # proposal pipeline notices; notifySlack no-ops if unset
LLM_PROVIDER = "gemini"                      # 2026-07-06: Anthropic account out of credits — composition (flash for briefs, pro for pitch/proposal) + google_search web research all run on Gemini (GEMINI_API_KEY secret). Remove this line to flip back to Claude.
# SLACK_EMAIL_DIGEST_CHANNEL_ID = "C..."     # inbox triage digest notices; postInboxDigest no-ops if unset
# Public base URL of this Worker — used to build proposal live links (/p/:dealId).
# Set to the deployed workers.dev subdomain or a custom domain after first deploy.
PUBLIC_BASE_URL = "https://rt-sales-call-agent.smathdaddy.workers.dev"

# Required secrets (set via `wrangler secret put`):
#   ANTHROPIC_API_KEY
#   NOTION_API_KEY
#   CALENDLY_WEBHOOK_SIGNING_KEY     (populated after webhook subscription is created)
#   CALENDLY_PERSONAL_ACCESS_TOKEN
#   SPOTIFY_CLIENT_ID
#   SPOTIFY_CLIENT_SECRET
#   GMAIL_OAUTH_REFRESH_TOKEN        (gmail.readonly + drive.readonly scopes)
#   GMAIL_OAUTH_CLIENT_ID
#   GMAIL_OAUTH_CLIENT_SECRET
#   TIDES_TRACKER_API_KEY            (optional)

# Cloudflare Browser Rendering — headless Chromium for HTML -> PDF (pitch decks).
# Requires Browser Rendering enabled on the account/plan. Only runs in a deployed
# Worker; `wrangler dev` and unit tests do not provide a live browser, so
# src/integrations/pdf.ts falls back to a pending key when the binding is absent.
[browser]
binding = "BROWSER"

# R2 bucket for pitch PDFs
[[r2_buckets]]
binding = "PITCH_PDFS"
bucket_name = "rt-sales-pitch-pdfs"

# KV for cron cursor + short-lived state
[[kv_namespaces]]
binding = "STATE"
id = "926fd9f294ce495f89ba2f5fba2e41b2"
