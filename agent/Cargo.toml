[package]
name = "rt-carousel-agent"
version = "0.1.0"
edition = "2024"
description = "Rising Tides carousel generation agent — Midnight Press voice, source-grounded, IG/TikTok-ready"

[[bin]]
name = "rt-carousel-agent"
path = "src/main.rs"

[dependencies]
# HTTP server
axum = { version = "0.7", features = ["macros", "multipart"] }
tokio = { version = "1.40", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_urlencoded = "0.7"

# Slack signature verification (HMAC-SHA256 over v0:{ts}:{body})
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

# HTTP client (Slack API, Claude API, Neo4j REST)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart", "stream"] }

# Templating (HTML rendering)
askama = "0.12"

# Headless Chrome for PNG screenshots
headless_chrome = "1.0"
base64 = "0.22"

# PDF generation (Phase 2)
printpdf = "0.7"
image = "0.25"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
slug = "0.1"
once_cell = "1.20"

# Markdown parsing (course-index.md)
pulldown-cmark = "0.12"

# WebSocket (Slack Socket Mode — Phase 2)
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"

# Config
dotenvy = "0.15"
dirs = "5.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
